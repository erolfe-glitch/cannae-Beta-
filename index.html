  </footer>

<script>
// ===== CANNAE ENGINE (no DOM) =====
const COLS = 26, ROWS = 16;
const DIRS = [[0,-1],[1,-1],[1,0],[0,1],[-1,1],[-1,0]]; // flat-top axial: N,NE,SE,S,SW,NW
const SQ3 = Math.sqrt(3);
const BREAK = { R: 0.65, C: 0.55 };
let DMG = 0.45, FI = 0.8; // FI: Infanterie frontal gegen Infanterie (Schildwall)

function ax(c, r) { return [c, r - ((c - (c & 1)) >> 1)]; }
function off(q, r) { return [q, r + ((q - (q & 1)) >> 1)]; }
function nb(c, r, d) { const [q, a] = ax(c, r); return off(q + DIRS[d][0], a + DIRS[d][1]); }
function inb(c, r) { return c >= 0 && r >= 0 && c < COLS && r < ROWS; }
function hdist(c1, r1, c2, r2) {
  const [q1, a1] = ax(c1, r1), [q2, a2] = ax(c2, r2);
  const dq = q1 - q2, dr = a1 - a2;
  return (Math.abs(dq) + Math.abs(dr) + Math.abs(dq + dr)) / 2;
}
function hpix(c, r) { return [1.5 * c, SQ3 * (r + 0.5 * (c & 1))]; }
function dirTo(c1, r1, c2, r2) {
  for (let d = 0; d < 6; d++) { const [c, r] = nb(c1, r1, d); if (c === c2 && r === r2) return d; }
  const p1 = hpix(c1, r1), p2 = hpix(c2, r2);
  const a = (Math.atan2(p2[1] - p1[1], p2[0] - p1[0]) * 180 / Math.PI + 90 + 360) % 360;
  return Math.round(a / 60) % 6;
}
function terr(c, r) {
  if (c === 0) return 'river';
  if (c === 1 && (r <= 1 || r >= ROWS - 1)) return 'river';
  return 'plain';
}
function passable(c, r) { return inb(c, r) && terr(c, r) !== 'river'; }
function inZone(side, c, r) { return passable(c, r) && (side === 'R' ? r <= 6 : r >= ROWS - 7); }

const TYPES = {
  legio:   { side:'R', name:'Legion', can:'Stark und zäh von vorn. Langsam, an Flanke und Rücken verwundbar.', cls:'inf', atk:5, def:5, mor:8, mv:2, men:4500,
             info:'Schwere Infanterie mit Pilum und großem Schild (Scutum). An diesem Tag ungewöhnlich tief aufgestellt.' },
  velites: { side:'R', name:'Veliten', can:'Wirft Speere über 2 Felder, ohne Gegenschlag. Weicht Infanterie aus, schwach im Nahkampf.', cls:'light', atk:2, def:2, mor:5, mv:3, rng:2, shoot:3, men:2000,
             info:'Junge, leicht bewaffnete Plänkler mit Wurfspeeren. Eröffnen den Kampf vor der Hauptlinie.' },
  equites: { side:'R', name:'Römische Reiterei', can:'Schnell. Stark gegen Flanke und Rücken, schwach frontal gegen Infanterie.', cls:'cav', atk:4, def:4, mor:6, mv:4, men:800,
             info:'Bürgerreiterei aus Rom. Zahlenmäßig klein, eingezwängt zwischen Fluss und Infanterie.' },
  socii:   { side:'R', name:'Bundesgenossen-Reiterei', can:'Schnell. Stark gegen Flanke und Rücken, schwach frontal gegen Infanterie.', cls:'cav', atk:4, def:4, mor:6, mv:4, men:1200,
             info:'Reiter der italischen Verbündeten Roms, auf dem offenen linken Flügel.' },
  gaul:    { side:'C', name:'Gallier', can:'Harter Angriff, aber wenig Schutz. Weicht unter Druck zurück.', cls:'inf', atk:5, def:4, mor:7, mv:2, men:3500,
             info:'Kämpften laut Polybios mit nacktem Oberkörper und langen Hiebschwertern. Wild im Angriff, wenig Schutz.' },
  iber:    { side:'C', name:'Iberer', can:'Solide Infanterie, etwas standfester als die Gallier.', cls:'inf', atk:5, def:5, mor:8, mv:2, men:2500,
             info:'Krieger aus Spanien in weißen Tuniken mit purpurnem Saum, bewaffnet mit Kurzschwertern.' },
  afr:     { side:'C', name:'Libyer', can:'Hannibals beste Infanterie: stark in Angriff und Abwehr, hohe Moral.', cls:'inf', atk:6, def:6, mor:8, mv:2, men:1700,
             info:'Erfahrene afrikanische Veteranen. Trugen erbeutete römische Rüstungen aus früheren Siegen.' },
  sling:   { side:'C', name:'Balearische Schleuderer', can:'Schießt über 3 Felder, ohne Gegenschlag. Weicht Infanterie aus, schwach im Nahkampf.', cls:'light', atk:2, def:2, mor:5, mv:3, rng:3, shoot:4, men:2000,
             info:'Von den Balearen. Galten als die besten Schleuderer der antiken Welt.' },
  hcav:    { side:'C', name:'Schwere Reiterei', can:'Stärkster Angriff im Spiel. Ansturm nach 2 Feldern ×1,25.', cls:'cav', atk:7, def:5, mor:8, mv:4, men:1600,
             info:'Iberische und gallische Reiter unter Hasdrubal. Gepanzert und kampferprobt.' },
  numid:   { side:'C', name:'Numidische Reiter', can:'Schnellste Einheit. Wirft Speere über 2 Felder und weicht Infanterie aus.', cls:'lcav', atk:3, def:3, mor:7, mv:5, rng:2, shoot:2, men:1200,
             info:'Leichte Reiter aus Nordafrika, ohne Sattel und Zaumzeug. Schnell, mit Wurfspeeren.' }
};
const isCav = u => TYPES[u.type].cls === 'cav' || TYPES[u.type].cls === 'lcav';

const LEADERS = {
  Paullus: { full:'Lucius Aemilius Paullus', info:'Konsul. Führte die römische Reiterei am Fluss und fiel in der Schlacht.' },
  Servilius: { full:'Gnaeus Servilius Geminus', info:'Konsul des Vorjahres. Führte das Zentrum.' },
  Atilius: { full:'Marcus Atilius Regulus', info:'Konsul des Vorjahres. Führte mit Servilius das Zentrum.' },
  Varro: { full:'Gaius Terentius Varro', info:'Konsul mit dem Oberbefehl an diesem Tag. Führte die Bundesgenossen-Reiterei.' },
  Hannibal: { full:'Hannibal Barkas', info:'Feldherr Karthagos. Stand selbst in der Mitte bei Galliern und Iberern.' },
  Mago: { full:'Mago Barkas', info:'Hannibals jüngerer Bruder. Stand mit ihm im Zentrum.' },
  Hasdrubal: { full:'Hasdrubal', info:'Befehlshaber der schweren Reiterei am Fluss.' },
  Maharbal: { full:'Maharbal', info:'Führer der Numider (manche Quellen nennen Hanno).' }
};

const SETUP = [
  // Rom (Blick nach Süden)
  ['equites',3,4],['equites',4,4,'Paullus'],['equites',5,4],
  ['legio',8,4],['legio',9,4],['legio',10,4],['legio',11,4],['legio',12,4],['legio',13,4],['legio',14,4],['legio',15,4],
  ['legio',8,3],['legio',9,3],['legio',10,3],['legio',11,3,'Servilius'],['legio',12,3,'Atilius'],['legio',13,3],['legio',14,3],['legio',15,3],
  ['socii',18,4],['socii',19,4,'Varro'],['socii',20,4],
  ['velites',8,5],['velites',10,5],['velites',13,5],['velites',15,5],
  // Karthago (Blick nach Norden), Mitte als nach vorn gewölbter Halbmond
  ['hcav',2,11],['hcav',3,11,'Hasdrubal'],['hcav',4,11],['hcav',5,11],
  ['afr',6,11],['afr',7,11],['afr',7,12],
  ['gaul',8,11],['iber',9,10],['gaul',10,10],['iber',11,9,'Hannibal'],['gaul',12,9,'Mago'],['iber',13,10],['gaul',14,10],['iber',15,11],
  ['afr',16,11],['afr',17,11],['afr',16,12],
  ['numid',19,11],['numid',20,11,'Maharbal'],['numid',21,11],
  ['sling',9,9],['sling',12,8],['sling',14,9]
];

function newGame(rng) {
  const G = { turn:1, maxTurn:16, side:'R', phase:'A', units:[], over:null, rng: rng || Math.random, ms:{}, fortune:null,
    stats:{ R:{flank:0,rear:0,enc:0,rally:0,back:0,evade:0}, C:{flank:0,rear:0,enc:0,rally:0,back:0,evade:0} } };
  SETUP.forEach((s, i) => {
    const T = TYPES[s[0]];
    G.units.push({ id:i, type:s[0], side:T.side, c:s[1], r:s[2], face: T.side === 'R' ? 3 : 0,
      str:10, mor:T.mor, status:'ok', home:s[1], leader:s[3] || null, moved:false, attacked:false, movedDist:0, mp:T.mv,
      cmd: s[1] <= 12 ? 'A' : 'B' });
  });
  G.init = { R:0, C:0 }; for (const u of G.units) G.init[u.side] += TYPES[u.type].men;
  return G;
}
function setBalance(m) { BREAK.R = m === 'even' ? 0.8 : 0.65; } // 'even': Roms Heer hält länger durch (KI gegen KI etwa 50:50)
function finishDeploy(G) { for (const u of G.units) { u.home = u.c; u.cmd = u.c <= 12 ? 'A' : 'B'; } }

const alive = u => u.status === 'ok' || u.status === 'routed';
function unitAt(G, c, r) { for (const u of G.units) if (u.c === c && u.r === r && alive(u)) return u; return null; }
function adjUnits(G, u, c = u.c, r = u.r) {
  const out = [];
  for (let d = 0; d < 6; d++) { const [nc, nr] = nb(c, r, d); if (!inb(nc, nr)) continue; const o = unitAt(G, nc, nr); if (o && o !== u) out.push({ o, d }); }
  return out;
}
function isZOC(G, c, r, side) {
  for (let d = 0; d < 6; d++) { const [nc, nr] = nb(c, r, d); if (!inb(nc, nr)) continue; const o = unitAt(G, nc, nr); if (o && o.side !== side && o.status === 'ok') return true; }
  return false;
}
function adjEnemies(G, u, c = u.c, r = u.r) { return adjUnits(G, u, c, r).filter(x => x.o.side !== u.side && x.o.status === 'ok'); }
function leaderNear(G, u, rad) { return G.units.some(o => o.side === u.side && o.status === 'ok' && o.leader && hdist(o.c, o.r, u.c, u.r) <= rad); }
function supported(G, u) { const [c, r] = nb(u.c, u.r, (u.face + 3) % 6); const o = inb(c, r) && unitAt(G, c, r); return !!(o && o.side === u.side && o.status === 'ok'); }
function crowded(G, u) {
  let n = 0;
  for (let d = 0; d < 6; d++) { const [c, r] = nb(u.c, u.r, d); if (!passable(c, r) || unitAt(G, c, r)) n++; }
  return n >= 5;
}
function surrounded(G, u) {
  const dirs = []; let blocked = 0;
  for (let d = 0; d < 6; d++) {
    const [c, r] = nb(u.c, u.r, d);
    if (!passable(c, r)) { blocked++; continue; }
    const o = unitAt(G, c, r);
    if (o) { blocked++; if (o.side !== u.side && o.status === 'ok') dirs.push(d); }
  }
  if (dirs.length >= 3) return true;
  for (const d of dirs) if (dirs.includes((d + 3) % 6)) return true;
  return dirs.length >= 2 && blocked === 6;
}

function reachable(G, u) {
  const res = new Map(), K = (c, r) => c * 100 + r;
  res.set(K(u.c, u.r), { c:u.c, r:u.r, cost:0, prev:null, stop:false, occ:false });
  if (u.attacked || u.mp <= 0 || u.status !== 'ok') return res;
  const mp = pinnedNow(G, u) ? 1 : u.mp;
  const q = [[u.c, u.r]];
  while (q.length) {
    const [c, r] = q.shift(); const cur = res.get(K(c, r));
    if ((cur.stop && cur.cost > 0) || cur.cost >= mp) continue;
    for (let d = 0; d < 6; d++) {
      const [nc, nr] = nb(c, r, d);
      if (!passable(nc, nr)) continue;
      const key = K(nc, nr); if (res.has(key)) continue;
      const o = unitAt(G, nc, nr);
      if (o && o.side !== u.side) continue;
      res.set(key, { c:nc, r:nr, cost:cur.cost + 1, prev:K(c, r), stop:isZOC(G, nc, nr, u.side), occ:!!o });
      q.push([nc, nr]);
    }
  }
  return res;
}
function pinnedNow(G, u) { return isCav(u) ? adjEnemies(G, u).some(x => isCav(x.o)) : isZOC(G, u.c, u.r, u.side); }
function pathTo(res, key) { const p = []; while (key != null) { const n = res.get(key); p.unshift([n.c, n.r]); key = n.prev; } return p; }

// Bewegungspunkte bleiben übrig. Wer festgehalten wird, darf nur 1 Feld weichen und verbraucht damit alles.
function doMove(G, u, key, res) {
  const path = pathTo(res, key);
  if (path.length < 2) return [];
  const pinned = pinnedNow(G, u);
  const a = path[path.length - 2], b = path[path.length - 1];
  u.face = dirTo(a[0], a[1], b[0], b[1]);
  u.c = b[0]; u.r = b[1];
  const cost = path.length - 1;
  u.movedDist = (u.movedDist || 0) + cost; u.mp -= cost; u.moved = true;
  if (pinned || isZOC(G, u.c, u.r, u.side)) u.mp = 0;
  return [{ t:'move', u, path }];
}
function canRotate(u) { return u.status === 'ok' && !u.attacked; }
function rotate(G, u, delta) { if (canRotate(u)) u.face = (u.face + delta + 6) % 6; }

function targets(G, u, ignoreFlags) {
  if (u.status !== 'ok' || (!ignoreFlags && u.attacked)) return [];
  const T = TYPES[u.type], out = [];
  const adj = adjUnits(G, u).filter(x => x.o.side !== u.side);
  adj.forEach(x => out.push({ u:x.o, kind:'melee' }));
  const engaged = adj.some(x => x.o.status === 'ok');
  if (T.rng && !engaged) for (const o of G.units) {
    if (!alive(o) || o.side === u.side) continue;
    const dd = hdist(u.c, u.r, o.c, o.r); if (dd > 1 && dd <= T.rng) out.push({ u:o, kind:'shoot' });
  }
  return out;
}

function arcOf(d, a) {
  const diff = (dirTo(d.c, d.r, a.c, a.r) - d.face + 6) % 6;
  return diff === 3 ? 'rear' : (diff === 2 || diff === 4) ? 'flank' : 'front';
}
function evadeDir(G, d, a) {
  const D = TYPES[d.type], A = TYPES[a.type];
  if (d.status !== 'ok' || !((D.cls === 'light' || D.cls === 'lcav') && A.cls === 'inf')) return null;
  const away = dirTo(a.c, a.r, d.c, d.r);
  for (const dd of [away, (away + 1) % 6, (away + 5) % 6]) { const [c, r] = nb(d.c, d.r, dd); if (passable(c, r) && !unitAt(G, c, r)) return dd; }
  return null;
}
function meleeCalc(G, a, d) {
  const A = TYPES[a.type], D = TYPES[d.type]; let m = 1; const tags = [];
  let arc = arcOf(d, a);
  if (d.status === 'routed') { m *= 1.6; arc = 'rear'; tags.push('Fliehender Gegner ×1,6'); }
  else if (arc === 'flank') { m *= 1.4; tags.push('Flanke ×1,4'); }
  else if (arc === 'rear') { m *= 1.8; tags.push('Rücken ×1,8'); }
  if (isCav(a) && a.movedDist >= 2) { m *= 1.25; tags.push('Reiter-Ansturm ×1,25'); }
  if (isCav(a) && D.cls === 'inf' && arc === 'front' && d.status === 'ok') { m *= 0.6; tags.push('Reiter gegen Schildwall ×0,6'); }
  if (A.cls === 'inf' && D.cls === 'inf' && arc === 'front' && d.status === 'ok') { m *= FI; tags.push('Schildwall von vorn ×' + String(FI).replace('.', ',')); }
  if (crowded(G, a)) { m *= 0.8; tags.push('Gedränge ×0,8'); }
  if (leaderNear(G, a, 2)) { m *= 1.1; tags.push('Anführer nah ×1,1'); }
  const ev = evadeDir(G, d, a) != null;
  if (ev) { m *= 0.5; tags.push('Plänkler weichen aus ×0,5'); }
  const base = DMG * (A.atk / D.def) * (0.4 + 0.6 * a.str / 10) * m;
  let cm = d.status === 'ok' && !ev ? (arc === 'front' ? 0.6 : arc === 'flank' ? 0.3 : 0) : 0;
  if (crowded(G, d)) cm *= 0.8;
  const cbase = DMG * (D.atk / A.def) * (0.4 + 0.6 * d.str / 10) * cm;
  return { base, cbase, arc, tags, evade: ev };
}
function shootCalc(G, a, d) {
  const A = TYPES[a.type], D = TYPES[d.type]; let m = 1; const tags = [];
  if (a.side === 'R') { m *= 0.8; tags.push('Staub im Gesicht ×0,8'); }
  if (d.status === 'routed') { m *= 1.3; tags.push('Fliehender Gegner ×1,3'); }
  if (D.cls === 'cav') { m *= 1.2; tags.push('Pferde sind große Ziele ×1,2'); }
  return { base: 1.6 * DMG * (A.shoot / D.def) * (0.4 + 0.6 * a.str / 10) * m, cbase:0, arc:'front', tags };
}

const rnd = G => 0.75 + G.rng() * 0.5;
function attack(G, a, d, kind) {
  const evs = [];
  const k = kind === 'shoot' ? shootCalc(G, a, d) : meleeCalc(G, a, d);
  const dmg = k.base * rnd(G), cd = k.cbase * rnd(G);
  a.face = dirTo(a.c, a.r, d.c, d.r); a.attacked = true; a.moved = true; a.mp = 0;
  if (kind === 'melee' && d.status === 'ok') { if (k.arc === 'flank') G.stats[a.side].flank++; if (k.arc === 'rear') G.stats[a.side].rear++; }
  const ev = { t: kind, a, d, arc:k.arc, dmg, cd, tags:k.tags, mlD:0, mlA:0, evade:!!k.evade };
  evs.push(ev);
  const sur = surrounded(G, d);
  const evDir = k.evade ? evadeDir(G, d, a) : null;
  ev.mlD = damage(G, d, dmg, { arc: kind === 'shoot' ? 'front' : k.arc, sur, from:a.side, shoot: kind === 'shoot', evade: !!k.evade, away: kind === 'melee' ? dirTo(a.c, a.r, d.c, d.r) : null }, evs);
  if (cd > 0.05 && alive(a)) ev.mlA = damage(G, a, cd, { arc:'front', counter:true, sur:false, from:d.side }, evs);
  if (evDir != null && d.status === 'ok') {
    const [c, r] = nb(d.c, d.r, evDir);
    if (passable(c, r) && !unitAt(G, c, r)) { const from = [d.c, d.r]; d.c = c; d.r = r; G.stats[d.side].evade++; evs.push({ t:'move', u:d, path:[from, [c, r]], push:true }, { t:'evade', u:d }); }
  } else if (kind === 'melee' && d.status === 'ok' && d.mor < 3 && !surrounded(G, d)) fallBack(G, d, dirTo(a.c, a.r, d.c, d.r), evs);
  checkEnd(G);
  return evs;
}
function damage(G, u, dmg, info, evs) {
  u.str = Math.max(0, u.str - dmg);
  let ml = 0;
  if (u.status === 'ok') {
    ml = dmg * (info.shoot ? 1.0 : info.counter ? 0.6 : info.evade ? 0.5 : 0.8) + (info.arc === 'flank' ? 0.5 : info.arc === 'rear' ? 1 : 0) + (info.sur ? 1 : 0);
    if (supported(G, u)) ml *= 0.75;
    if (leaderNear(G, u, 3)) ml *= 0.85;
    u.mor -= ml;
    if (u.mor <= 0 && u.str > 5 && !info.sur && info.away != null && info.arc !== 'rear' && canFall(G, u, info.away)) u.mor = 0.5;
  }
  if (u.str <= 0.05) kill(G, u, evs, info.sur, info.from);
  else if (u.status === 'ok' && (u.mor <= 0 || u.str < 1.5)) rout(G, u, evs, 0);
  return ml;
}
function canFall(G, u, away) {
  return [away, (away + 1) % 6, (away + 5) % 6].some(d => { const [c, r] = nb(u.c, u.r, d); return passable(c, r) && !unitAt(G, c, r); });
}
function fallBack(G, u, away, evs) {
  for (const d of [away, (away + 1) % 6, (away + 5) % 6]) {
    const [c, r] = nb(u.c, u.r, d);
    if (!passable(c, r) || unitAt(G, c, r)) continue;
    const from = [u.c, u.r]; u.c = c; u.r = r; u.mor += 1;
    G.stats[u.side].back = (G.stats[u.side].back || 0) + 1;
    evs.push({ t:'move', u, path:[from, [c, r]], push:true }, { t:'back', u });
    return true;
  }
  return false;
}
function rout(G, u, evs, depth) {
  u.status = 'routed'; u.mor = 0;
  evs.push({ t:'rout', u });
  panic(G, u, 2, 1, evs, depth);
  leaderCheck(G, u, 0.3, evs, depth);
}
function kill(G, u, evs, sur, from) {
  const wasRouted = u.status === 'routed';
  u.status = 'dead'; u.str = 0;
  evs.push({ t:'dead', u, sur });
  if (sur && from) G.stats[from].enc++;
  if (!wasRouted) panic(G, u, 2, 1.5, evs, 0);
  leaderCheck(G, u, 0.6, evs, 0);
}
function panic(G, src, rad, amt, evs, depth) {
  if (depth >= 2) return;
  for (const o of G.units) {
    if (o === src || o.side !== src.side || o.status !== 'ok' || hdist(o.c, o.r, src.c, src.r) > rad) continue;
    const m = amt * (leaderNear(G, o, 3) ? 0.5 : 1);
    o.mor -= m; evs.push({ t:'panic', u:o, amt:m });
    if (o.mor <= 0) { if (o.str > 5 && !surrounded(G, o)) o.mor = 0.5; else rout(G, o, evs, depth + 1); } // Panik allein bricht keine starke, freie Einheit

  if (e.key === 'Escape') deselect();
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') undo();
  if (e.key === 'Enter' && !$('#btnEnd').disabled) $('#btnEnd').click();
});
$('#btnEnd').onclick = () => {
  if (deploying) { const d = deployDone; deployDone = null; deploying = null; sel = null; d && d(); return; }
  if (busy || !humans.has(G.side)) return; undoStack = []; deselect(); nextTurn();
};
$('#btnSpeed').onclick = () => { speed = speed >= 3 ? 1 : speed + 1; $('#btnSpeed').textContent = `${speed}×`; };
let ZOOM = 1;
$('#btnZoom').onclick = () => {
  const bd = $('#board'), fx = (bd.scrollLeft + bd.clientWidth / 2) / bd.scrollWidth, fy = (bd.scrollTop + bd.clientHeight / 2) / bd.scrollHeight;
  ZOOM = ZOOM === 1 ? 1.3 : ZOOM === 1.3 ? 1.6 : 1;
  $('#btnZoom').textContent = '🔍 ' + String(ZOOM).replace('.', ',') + '×';
  bd.classList.toggle('zoomed', ZOOM > 1);
  cv.style.width = ZOOM > 1 ? (bd.clientWidth * ZOOM) + 'px' : ''; cv.style.height = ZOOM > 1 ? (bd.clientHeight * ZOOM) + 'px' : '';
  resize();
  bd.scrollLeft = fx * bd.scrollWidth - bd.clientWidth / 2; bd.scrollTop = fy * bd.scrollHeight - bd.clientHeight / 2;
};
$('#btnLog').onclick = () => { $('#logBox').hidden = !$('#logBox').hidden; };
$('#btnFull').onclick = () => { const el = document.documentElement; (document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen?.())?.catch?.(() => {}); };
$('#btnMenu').onclick = () => showStart(true);
document.addEventListener('fullscreenchange', () => setTimeout(resize, 50));
new ResizeObserver(() => resize()).observe($('#board'));

// --- turn flow
function banner(text, side, ms = 1500) {
  const b = $('#banner'); b.textContent = text; b.className = 'banner ' + side; b.hidden = false;
  clearTimeout(banner.t); if (ms) banner.t = setTimeout(() => { b.hidden = true; }, ms);
}
async function turnIntro() {
  if (await checkOver()) return;
  updateUI();
  const s = G.side;
  if (humans.has(s)) {
    const needHand = mode === 'hot' || isCoop();
    const who = isCoop() ? CMDNAME[G.phase] : (mode === 'hot' ? (s === 'R' ? 'Spieler Rom' : 'Spieler Karthago') : '');
    if (needHand) await showHandoff(s, who);
    banner(`Runde ${G.turn} · ${SIDE[s]}${isCoop() ? ' · ' + (G.phase === 'A' ? 'Westen' : 'Osten') : ''}`, s);
    addLog('', ''); logItems.shift();
  } else await runAI();
}
async function runAI() {
  busy = true; updateUI(); banner(`${SIDE[G.side]} (KI) ist am Zug …`, G.side, 0);
  for (const u of aiOrder(G, G.side)) {
    if (u.status !== 'ok') continue;
    const evs = aiAct(G, u, 'hist');
    if (evs.length) { await playEvents(evs); await wait(110); }
    if (G.over) break;
  }
  $('#banner').hidden = true; busy = false;
  if (await checkOver()) return;
  await nextTurn();
}
async function nextTurn() {
  if (G.over) { await checkOver(); return; }
  if (isCoop() && humans.has(G.side) && G.phase === 'A') { G.phase = 'B'; undoStack = []; deselect(); await turnIntro(); return; }
  busy = true; updateUI();
  const evs = endTurn(G);
  for (const u of G.units) u.rotated = false;
  logItems.unshift({ side:'turn', text:`Runde ${Math.min(G.turn, G.maxTurn)} · ${SIDE[G.side]}` }); renderLog();
  await playEvents(evs);
  busy = false; await turnIntro();
}
async function checkOver() { if (G && G.over) { busy = true; updateUI(); await wait(700); showDebrief(); return true; } return false; }

// --- overlays
function showHandoff(side, who, dep) {
  return new Promise(res => {
    const o = $('#overlay');
    o.innerHTML = `<div class="sheet handoff"><span class="eyebrow">${dep ? 'Vor der Schlacht' : 'Runde ' + G.turn}</span><h2>${SIDE[side]}</h2><p class="lead">${dep ? who + '.' : (who ? who + ' ist am Zug.' : '')} ${isCoop() ? 'Sprecht euch ab: Was macht der andere Flügel?' : 'Gerät weitergeben.'}</p><button class="btn primary" id="go" style="max-width:320px">Los geht’s</button></div>`;
    o.hidden = false; $('#go').focus();
    $('#go').onclick = () => { o.hidden = true; res(); };
  });
}
function showStart(fromMenu) {
  const o = $('#overlay'); const running = fromMenu && G && !G.over;
  o.innerHTML = `<div class="sheet">
    <div><span class="eyebrow">2. August 216 v. Chr. · Apulien, am Fluss Aufidus</span><h2>Cannae</h2></div>
    <p class="lead">Seit zwei Jahren schlägt Hannibal die Römer in Italien. Jetzt hat Rom das größte Heer seiner Geschichte aufgestellt, um den Krieg mit einem Schlag zu beenden.</p>
    <div class="grid2">
      <div class="force R"><h4>Rom</h4><div class="big">≈ 80.000 Fußsoldaten · 6.000 Reiter</div><p>Konsuln Varro und Paullus, im Zentrum Servilius und Atilius. Die Legionen stehen an diesem Tag ungewöhnlich tief und eng gestaffelt. Reiterei auf beiden Flügeln, rechts am Fluss.</p></div>
      <div class="force C"><h4>Karthago</h4><div class="big">≈ 40.000 Fußsoldaten · 10.000 Reiter</div><p>Hannibal und sein Bruder Mago. Gallier und Iberer in der Mitte, libysche Veteranen, Schleuderer von den Balearen. Schwere Reiterei unter Hasdrubal, leichte Numider.</p></div>
      <div class="force T"><h4>Gelände</h4><p>Eine weite, flache Ebene. Im Westen (im Bild hinten) begrenzt der Aufidus das Feld, Ausweichen ist dort unmöglich. Karthago steht links, Rom rechts. Ein heißer Wind treibt den Römern Staub ins Gesicht.</p></div>
    </div>
    <div><h3 style="font-family:var(--display);font-weight:400;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--muted);margin:0 0 8px">Wer führt?</h3>
    <div class="modes">
      ${[['solo-C', 'Als Hannibal', 'Du führst Karthago, die KI führt Rom.'], ['solo-R', 'Als Varro & Paullus', 'Du führst Rom, die KI führt Karthago.'], ['hot', '2 Spieler: gegeneinander', 'Rom gegen Karthago an einem Gerät.'], ['coop-C', '2 Spieler: gemeinsam Karthago', 'Ihr teilt die Flügel und müsst euch absprechen.'], ['coop-R', '2 Spieler: gemeinsam Rom', 'Ihr teilt die Flügel gegen Hannibals KI.']]
        .map(([v, b, s]) => `<label class="mode"><input type="radio" name="mode" value="${v}" ${v === mode ? 'checked' : ''}><b>${b}</b><span>${s}</span></label>`).join('')}
    </div></div>
    <div><h3 style="font-family:var(--display);font-weight:400;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--muted);margin:0 0 8px">Kräfteverhältnis</h3>
    <div class="modes">
      ${[['hist', 'Historisch', 'Wie 216 v. Chr.: Hannibal ist im Vorteil, als Rom ist es schwer.'], ['even', 'Ausgeglichen', 'Roms Heer hält länger durch. Beide Seiten haben etwa gleiche Chancen.']]
        .map(([v, b, s]) => `<label class="mode"><input type="radio" name="bal" value="${v}" ${v === balance ? 'checked' : ''}><b>${b}</b><span>${s}</span></label>`).join('')}
    </div></div>
    <ul class="rules">
      <li>Einheit antippen: Ihre Werte stehen neben oder unter der Karte. Helle Felder zeigen, wohin sie ziehen kann, die Zahl sind die Schritte.</li>
      <li>Bewegungspunkte kannst du aufteilen. Drehen ist frei, bis die Einheit kämpft. Danach ist sie fertig.</li>
      <li>Einen Zug kannst du zurücknehmen, solange danach noch nicht gekämpft wurde.</li>
      <li>Fernkämpfer schießen über Distanz und zermürben die Moral. Plänkler weichen schwerer Infanterie aus.</li>
      <li>Rot umrandete Gegner sind angreifbar. Am Touchscreen: zweimal tippen.</li>
      <li>Reiter können sich von Infanterie frei lösen, nur gegnerische Reiter halten sie fest.</li>
      <li>Infanterie hält von vorn lange stand (Schildwall). Entscheidend sind Flanke und Rücken.</li>
      <li>Die Figuren schauen in ihre Blickrichtung, die helle Kante am Boden zeigt die Front. Flanke und Rücken sind verwundbar.</li>
      <li>Stärke sinkt durch Verluste. Moral sinkt durch Verluste, Angriffe von der Seite und fliehende Nachbarn.</li>
      <li>Moral bei null: Die Einheit flieht. Anführer in der Nähe können sie wieder sammeln.</li>
      <li>Eingekesselte Einheiten finden keinen Fluchtweg.</li>
      <li>Ein Heer bricht zusammen, wenn es zu viele Kämpfer verloren hat.</li>
    </ul>
    <div class="opts"><label><input type="checkbox" id="optBlood" ${blood ? 'checked' : ''}> Blut anzeigen</label></div>
    <div class="start-row"><button class="btn primary" id="startBtn">Schlacht beginnen</button>${running ? '<button class="btn" id="resumeBtn">Weiterspielen</button>' : ''}</div>
    <p class="src">Zahlen gerundet nach Polybios. Die antiken Quellen (Polybios, Livius) weichen teils voneinander ab.</p>
  </div>`;
  o.hidden = false;
  $('#startBtn').onclick = () => {
    mode = (o.querySelector('input[name=mode]:checked') || {}).value || 'solo-C';
    balance = (o.querySelector('input[name=bal]:checked') || {}).value || 'hist';
    blood = $('#optBlood').checked; o.hidden = true; startGame();
  };
  if (running) $('#resumeBtn').onclick = () => { blood = $('#optBlood').checked; redrawDecals(); o.hidden = true; };
}
async function startGame() {
  humans = new Set(mode === 'hot' ? ['R', 'C'] : mode.endsWith('C') ? ['C'] : ['R']);
  setBalance(balance); G = newGame(); decals = []; parts = []; floats = []; projs = []; tweens.length = 0; logItems = []; renderLog(); redrawDecals();
  for (const u of G.units) { u.ox = u.oy = 0; u.shake = 0; } syncAll(); deselect(); undoStack = []; evQueue = [];
  { const bd = $('#board'); bd.scrollLeft = (bd.scrollWidth - bd.clientWidth) * .3; }
  { // Aufstellungsphase immer: historisch übernehmen oder frei verschieben
    for (const s0 of ['R', 'C']) {
      if (!humans.has(s0)) continue;
      if (mode === 'hot') await showHandoff(s0, s0 === 'R' ? 'Spieler Rom stellt auf' : 'Spieler Karthago stellt auf', true);
      deploying = s0; sel = null; updateUI(); banner(`Aufstellung · ${SIDE[s0]}`, s0, 2200);
      await new Promise(res => { deployDone = res; });
    }
    finishDeploy(G); syncAll();
  }
  logItems.unshift({ side:'turn', text:'Runde 1 · Rom' }); renderLog();
  busy = true; await playEvents(startTurn(G)); busy = false;
  await turnIntro();
}
function showDebrief() {
  const w = G.over.winner, o = $('#overlay');
  const lost = s => G.init[s] * lostFrac(G, s);
  const focus = mode === 'hot' ? (w || 'C') : [...humans][0];
  const won = w === focus;
  const crit = focus === 'C'
    ? [['Sieg für Karthago', w === 'C'], ['Eigene Ausfälle unter 35 %', lostFrac(G, 'C') < .35], ['Mindestens 2 römische Einheiten eingekesselt vernichtet', G.stats.C.enc >= 2]]
    : [['Sieg für Rom', w === 'R'], ['Eigene Ausfälle unter 35 %', lostFrac(G, 'R') < .35], ['Keine eigene Einheit eingekesselt verloren', G.stats.C.enc === 0]];
  const stars = crit.filter(c => c[1]).length * (crit[0][1] ? 1 : 0);
  const head = w === null ? 'Unentschieden' : (mode === 'hot' ? `Sieg für ${SIDE[w]}` : won ? 'Sieg!' : 'Niederlage');
  const why = G.over.reason === 'break' ? `Das Heer von ${SIDE[w === 'R' ? 'C' : 'R']} ist zusammengebrochen.` : 'Die Sonne geht unter, keine Seite hat die andere gebrochen.';
  const st = G.stats[focus];
  const refl = focus === 'C'
    ? ['Warum konnte das kleinere Heer überhaupt gewinnen?', 'Welche Aufgabe hatte die Mitte, welche die Flügel?', 'Was passiert mit der Moral, wenn eine Einheit von allen Seiten bedrängt wird?']
    : ['Was hätte Rom anders machen können, um nicht eingekesselt zu werden?', 'Wofür war die tiefe Aufstellung gut, wofür schlecht?', 'Warum war die Reiterei so wichtig, obwohl sie zahlenmäßig klein war?'];
  o.innerHTML = `<div class="sheet">
    <div><span class="eyebrow">${why}</span><h2>${head}</h2></div>
    <div class="grid2">
      <div class="force ${focus}"><h4>Bewertung (${SIDE[focus]})</h4><div class="stars">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3 - stars)}</span></div><ul class="crit">${crit.map(c => `<li class="${c[1] ? 'ok' : ''}">${c[0]}</li>`).join('')}</ul></div>
      <div class="force T"><h4>Deine Schlacht</h4>
        <p>Dauer: <b>${Math.min(G.turn, G.maxTurn)}</b> Runden</p>
        <p>Ausfälle Rom: <b>≈ ${fmt(Math.round(lost('R') / 100) * 100)}</b> · Karthago: <b>≈ ${fmt(Math.round(lost('C') / 100) * 100)}</b></p>
        <p>Angriffe in die Flanke: <b>${st.flank}</b> · in den Rücken: <b>${st.rear}</b></p>
        <p>Eingekesselt vernichtet: <b>${G.stats[focus].enc}</b> · Geordnet zurückgewichen: <b>${st.back || 0}</b> · Gesammelt: <b>${st.rally}</b></p></div>
    </div>
    <div class="force C"><h4>Was wirklich geschah</h4>
      <p>Hannibal stellte Gallier und Iberer in einem nach vorn gewölbten Halbmond auf. Unter dem Druck der römischen Legionen wich die Mitte langsam zurück, ohne zu brechen. Die Römer drängten nach und gerieten immer tiefer hinein. Dann schwenkten die libyschen Veteranen von beiden Seiten in ihre Flanken.</p>
      <p>Hasdrubals schwere Reiterei zerschlug die römische Reiterei am Fluss, ritt hinter dem römischen Heer herum und half den Numidern gegen die Bundesgenossen-Reiterei. Danach fiel sie den Legionen in den Rücken. Das römische Heer war eingeschlossen.</p>
      <p>Rom verlor je nach Quelle rund 50.000 bis 70.000 Mann, darunter den Konsul Paullus. Varro entkam. Karthago verlor knapp 6.000 Mann, die meisten davon Gallier aus der Mitte.</p></div>
    <div class="force T"><h4>Zum Nachdenken</h4><ol class="ref">${refl.map(r => `<li>${r}</li>`).join('')}</ol></div>
    <div class="start-row"><button class="btn primary" id="again">Nochmal</button><button class="btn" id="swap">Andere Seite spielen</button><button class="btn" id="menu">Zum Start</button></div>
  </div>`;
  o.hidden = false; busy = false; updateUI();
  $('#again').onclick = () => { o.hidden = true; startGame(); };
  $('#swap').onclick = () => { mode = { 'solo-C':'solo-R', 'solo-R':'solo-C', 'coop-C':'coop-R', 'coop-R':'coop-C', hot:'hot' }[mode]; o.hidden = true; startGame(); };
  $('#menu').onclick = () => showStart(false);
}

// --- boot
G = newGame(); for (const u of G.units) { u.ox = u.oy = 0; u.shake = 0; } syncAll();
buildSprites(); resize(); requestAnimationFrame(frame); updateUI();
showStart(false);
if (document.fonts) document.fonts.ready.then(() => { drawTerrain(); });
</script>
</body></html>
